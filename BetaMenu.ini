[BetaMenu]
; 1 = beta menü aktif, 0 = oyunun orijinal menüsü
Enabled=1
; DİKKAT: 1 yaparsan oyun yazıları ve "Tattoo" başlığını bozuk çiziyor. 0 bırak.
HideOriginalBackground=0
; Alt süs (ornament, gömülü doku). 1 = açık, 0 = süs yok (çizgili çerçeve kalır).
Ornament=1
; Sol üstteki yardım kutularına ("Use UP and DOWN to select..." vb.) süssüz beyaz çizgi + siyah kontur.
; 0 = kapalı (oyunun orijinali), 1 = açık. DİKKAT: bu ayar oyun açılırken okunur, değiştirince oyunu yeniden başlat.
HelpBoxFrame=0
HelpBoxFrameThickness=2
HelpBoxOutlineThickness=2
; Tanı logu (BetaMenu.log). Sadece hata ayıklarken 1 yap.
Log=0
; Çerçeve çizgisi ve süsün rengi (RRGGBB, başında # olabilir). F10 ile oyunda denenir.
LineColor=E1E1E1

; --- Kutu ölçüleri (640x448 sanal birim; oyun bunları ekran çözünürlüğüne göre ölçekler). ---
; Varsayılanlar orijinal panelin ölçüsüdür (kutu = orijinal panel). Oyunda F10 ile yeniden yüklenir.
OffsetX=0
OffsetY=0
; Sütun genişlikleri toplamına eklenen pay (orijinal: 44 px = 14.67 birim)
ExtraWidth=14.67
ExtraHeight=0
; Dikey düzen (5 farklı menüden ölçüldü): yükseklik = TitleHeight + RowHeight*satır + HeaderHeight*(başlık satırı varsa)
TitleHeight=46
HeaderHeight=19
RowHeight=15

; --- Görünüm ---
; Orijinal panel zaten yarı saydam siyah (sahneyi %25 parlaklığa düşürüyor); bizim kutu onun ÜSTÜNE biner.
; 0   = orijinalle aynı koyuluk (önerilen başlangıç)
; 60  = biraz daha koyu (sahne parlaklığı ~%19.5)
; 120 = belirgin koyu   (~%13.5)
; 215 = çok koyu        (~%4, eski değer)
BoxAlpha=70
; Beyaz çerçeve kalınlığı (kutunun dışında çizilir), kutuyla çerçeve arası boşluk
FrameThickness=2
FrameGap=0
; Beyaz çerçevenin dışındaki siyah kontur kalınlığı (0 = kontur yok)
OutlineThickness=2

; --- Alt süs (beta ekran görüntüsünden ölçülen değerler; F10 ile oyunda denenir) ---
; Yükseklik (sanal birim). Büyütürsen süs hem uzar hem genişler.
OrnamentHeight=34
; Yatay germe çarpanı. Görsel beta'dan daha "yüksek" bir orana sahip; 1.3 = beta'nın genişliğine yaklaşır.
OrnamentStretchX=1.3
; Süsü kenarlardan dışarı (+) / içeri (-) kaydır. Beta'da ~11 birim taşıyor.
OrnamentOffsetX=11
; Süsü aşağı (+) / yukarı (-) kaydır
OrnamentOffsetY=0
; Süsün etrafına eklenen ekstra siyah kontur (0 = yok). Kalın istersen 1.5-2 dene.
OrnamentOutline=1
