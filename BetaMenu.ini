[BetaMenu]
; 1 = beta menü aktif, 0 = oyunun orijinal menüsü
Enabled=1
; Orijinal arka planı gizle (beta kutusu yerine geçsin)
HideOriginalBackground=1
; Alt süs (ornament)
Ornament=1

; --- Kutu ölçüleri (640x448 sanal koordinat). Oyunda F10 ile yeniden yüklenir. ---
; Kutuyu panelin konumuna göre kaydır
OffsetX=-6
OffsetY=-8
; Sütun genişlikleri toplamına ve satır toplamına eklenecek pay
ExtraWidth=12
ExtraHeight=14
; Dikey düzen
TitleHeight=30
HeaderHeight=18
RowHeight=14.8

; --- Görünüm ---
BoxAlpha=215
FrameThickness=2
FrameGap=2
OrnamentHeight=22
