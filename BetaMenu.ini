[BetaMenu]
; 1 = beta menü aktif, 0 = oyunun orijinal menüsü
Enabled=1
; Orijinal arka planı gizle (beta kutusu yerine geçsin)
HideOriginalBackground=1
; Alt süs (ornament)
Ornament=1

; --- Kutu ölçüleri (640x448 sanal birim; oyun bunları ekran çözünürlüğüne göre ölçekler). ---
; Oyunda F10 ile yeniden yüklenir.
; Kutuyu panelin konumuna göre kaydır (negatif X = sola, negatif Y = yukarı)
OffsetX=-4
OffsetY=-8
; Sütun genişlikleri toplamına ve satır toplamına eklenecek pay (negatif yapıp daraltabilirsin)
ExtraWidth=12
ExtraHeight=16
; Dikey düzen: panel üstünden ilk satıra kadar olan alan, sütun başlığı satırı, satır aralığı
TitleHeight=23
HeaderHeight=14
RowHeight=14.4

; --- Görünüm ---
BoxAlpha=215
FrameThickness=2
FrameGap=2
OrnamentHeight=22
